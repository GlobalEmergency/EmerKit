name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version check (PRs only)
      - name: Check version bumped
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/propagate-version.sh --check

          # Check if app code was changed (lib/, assets/, pubspec.yaml, pubspec.lock)
          git fetch origin ${{ github.base_ref }} --depth=1
          APP_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- lib/ assets/ pubspec.yaml pubspec.lock | head -1)

          if [ -z "$APP_CHANGES" ]; then
            echo "ℹ️ No app code changes detected — version bump not required"
            exit 0
          fi

          PR_VERSION=$(grep -o '"version": *"[^"]*"' version.json | grep -o '"[^"]*"$' | tr -d '"')
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:version.json 2>/dev/null | grep -o '"version": *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || echo "0.0.0")

          echo "Base: $BASE_VERSION -> PR: $PR_VERSION"
          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "❌ ERROR: version.json has not been bumped ($BASE_VERSION -> $PR_VERSION)"
            echo "This PR changes app code. Please bump the version in version.json."
            exit 1
          else
            echo "✅ Version bumped: $BASE_VERSION -> $PR_VERSION"
          fi

      # Setup
      - uses: actions/setup-java@v5
        if: github.event_name == 'push'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache pub dependencies
      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Build only on push to main (not on PRs - saves ~2 min)
      - name: Cache Gradle
        if: github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        if: github.event_name == 'push'
        run: flutter build apk --debug

  analytics-plugin:
    name: Analytics plugin (PHP)
    runs-on: ubuntu-latest
    services:
      # Disposable database for store-test.php (it only touches test_emerkit_* tables).
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: analytics
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend/emerkit-analytics
    steps:
      - uses: actions/checkout@v6

      # The plugin declares PHP >= 7.4; production runs 8.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint plugin on PHP 7.4
        run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Lint on PHP 8.4
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
        run: |
          for t in contract wp host-alias store; do
            echo "== $t"
            php "tests/$t-test.php"
          done
